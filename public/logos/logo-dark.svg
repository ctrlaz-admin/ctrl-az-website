<svg width="360" height="110" viewBox="0 0 360 110" xmlns="http://www.w3.org/2000/svg">
  <!--
    Recreated approximation of the CTRL AZ wordmark for DARK-MODE
    (dark background, white "CTRL"). Replace with the real exported
    asset (same file name) for pixel-perfect brand fidelity.
  -->
  <defs>
    <linearGradient id="azGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2299C"/>
      <stop offset="45%" stop-color="#9A3EDB"/>
      <stop offset="100%" stop-color="#3EA8FF"/>
    </linearGradient>
  </defs>

  <!-- top-left corner accent -->
  <path d="M8 34 V12 H30" fill="none" stroke="#F2299C" stroke-width="3" stroke-linecap="round"/>
  <!-- bottom-right corner accent -->
  <path d="M352 76 V98 H330" fill="none" stroke="#3EA8FF" stroke-width="3" stroke-linecap="round"/>

  <text x="18" y="70" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="52" letter-spacing="-1" fill="#FFFFFF">CTRL</text>
  <text x="205" y="70" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="52" letter-spacing="-1" fill="url(#azGradDark)">AZ</text>
</svg>
