<svg width="360" height="110" viewBox="0 0 360 110" xmlns="http://www.w3.org/2000/svg">
  <!--
    Recreated approximation of the CTRL AZ wordmark for LIGHT-MODE
    (light background, dark "CTRL"). Replace with the real exported
    asset (same file name) for pixel-perfect brand fidelity.
  -->
  <defs>
    <linearGradient id="azGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC1D8C"/>
      <stop offset="45%" stop-color="#8B2AC7"/>
      <stop offset="100%" stop-color="#2E9CF5"/>
    </linearGradient>
  </defs>

  <!-- top-left corner accent -->
  <path d="M8 34 V12 H30" fill="none" stroke="#EC1D8C" stroke-width="3" stroke-linecap="round"/>
  <!-- bottom-right corner accent -->
  <path d="M352 76 V98 H330" fill="none" stroke="#2E9CF5" stroke-width="3" stroke-linecap="round"/>

  <text x="18" y="70" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="52" letter-spacing="-1" fill="#0B0B0E">CTRL</text>
  <text x="205" y="70" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="52" letter-spacing="-1" fill="url(#azGradLight)">AZ</text>
</svg>
